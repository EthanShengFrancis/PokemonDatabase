<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Cards</title>
</head>

<body>

    <!-- Was <header> + a separate <aside class="sidebar">.
         Now one single top bar div holding everything: button,
         title, and the collapsible controls wrapper.
         Dropped the <header> tag as you asked — a plain div is
         fine here since it's a layout container, not page content. -->
    <div class="topbar">

        <!-- menu-toggle stays OUTSIDE #sideBar on purpose — it can't be
             allowed to hide itself when toggling #sideBar's visibility -->
        <button id="menu-toggle" aria-label="Toggle menu">☰</button>

        <h1>TCG Pocket Card Database</h1>

        <!-- This is what menu-toggle actually shows/hides now:
             search + filters, grouped together, title stays visible always -->
        <div id="sideBar">
            <input type="text" id="searchInput" placeholder="Search pokemon name here">
            <button id="searchButton">Search</button>
            <div id="filters"></div>
        </div>

    </div>

    <!-- Unchanged — still the only scrollable region -->
    <main id="app" class="card-grid"></main>

    <script type="module" src="/src/main.js"></script>

</body>
